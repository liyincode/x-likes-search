<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X Likes Search</title>
    <link rel="stylesheet" href="feed.css" />
  </head>
  <body>
    <div class="shell">
      <div class="bar">
        <div class="logo"><b>X Likes</b><span class="t">Search</span></div>
        <div class="grow"></div>
        <a class="ico-btn square" href="https://github.com/liyincode/x-likes-search" target="_blank" rel="noopener noreferrer" title="Open GitHub repository" aria-label="Open GitHub repository">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .5A12 12 0 0 0 8.2 23.9c.6.1.8-.3.8-.6v-2.1c-3.3.7-4-1.4-4-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.8.1-.8.1-.8 1.2.1 1.9 1.2 1.9 1.2 1.1 1.9 2.9 1.3 3.6 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.4-1.3-5.4-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.2 11.2 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A12 12 0 0 0 12 .5Z"/>
          </svg>
        </a>
        <button class="ico-btn square" id="theme-btn" title="Toggle theme" aria-label="Toggle theme"></button>
        <div class="export-wrap" id="export-wrap">
          <button class="ico-btn" id="export" aria-haspopup="menu" aria-expanded="false">export</button>
          <div class="export-menu" id="export-menu" role="menu" hidden>
            <button role="menuitem" data-export="csv">
              <strong>Export current results (CSV)</strong>
              <span>Open in Excel or Numbers</span>
            </button>
            <button role="menuitem" data-export="json">
              <strong>Back up all data (JSON)</strong>
              <span>Advanced format</span>
            </button>
          </div>
        </div>
        <button class="ico-btn accent" id="open-likes">sync</button>
      </div>

      <div class="search-bar">
        <div class="cmd-wrap">
          <div class="cmd">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
              <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <input id="q" type="text" placeholder="Find a liked tweet…" autocomplete="off" spellcheck="false" />
            <span class="matchcount" id="mc"></span>
          </div>
          <div class="history" id="history"></div>
        </div>
      </div>

      <div class="filters">
        <div class="sortgrp" id="sort" aria-label="Sort results">
          <button data-sort="newest" aria-pressed="true">newest</button>
          <button data-sort="oldest" aria-pressed="false">oldest</button>
          <button data-sort="author" aria-pressed="false">author</button>
        </div>
        <div class="filter-right">
          <div class="photo-actions" id="photo-actions" hidden>
            <button class="mini" id="photo-select">select</button>
            <div class="photo-selection" id="photo-selection" hidden>
              <span id="photo-selected-count">0 selected</span>
              <button class="mini primary" id="photo-download" disabled>download</button>
              <button class="mini" id="photo-cancel">cancel</button>
            </div>
          </div>
          <div class="viewgrp" id="view-mode" aria-label="View mode">
            <button data-mode="posts" aria-pressed="true">posts</button>
            <button data-mode="photos" aria-pressed="false">photos</button>
          </div>
        </div>
      </div>

      <div class="feed-scroll" id="feed-scroll">
        <div class="results" id="results"></div>
        <div class="gallery" id="gallery" hidden></div>
        <div id="empty"></div>
      </div>
    </div>

    <div class="statusbar">
      <div class="sb-inner">
        <span class="sb-status"><span class="sb-dot"></span><span id="sb-status">0 liked · local only</span></span>
        <span class="sb-grow"></span>
        <span class="sb-hints">
          <span class="posts-hints"><span class="key">↵</span><span class="key">↓</span> next</span>
          <span class="posts-hints"><span class="key">↑</span> prev</span>
          <span class="posts-hints"><span class="key">⌘</span><span class="key">↵</span> open</span>
          <span class="photos-hints"><span class="key">←</span><span class="key">→</span> browse</span>
          <span><span class="key">esc</span> clear</span>
        </span>
      </div>
    </div>

    <div class="toast" id="toast"><span class="ic">✓</span><span id="toast-txt">Link copied</span></div>

    <div class="lightbox" id="lightbox" hidden aria-hidden="true">
      <button class="lb-backdrop" data-lightbox-close aria-label="Close photo preview"></button>
      <div class="lb-panel" role="dialog" aria-modal="true" aria-label="Photo preview">
        <button class="lb-close" data-lightbox-close aria-label="Close photo preview">×</button>
        <div class="lb-stage">
          <button class="lb-nav lb-prev" data-lightbox-move="-1" aria-label="Previous photo">←</button>
          <img id="lb-image" alt="" referrerpolicy="no-referrer" />
          <div class="lb-error" id="lb-error">Image unavailable</div>
          <button class="lb-nav lb-next" data-lightbox-move="1" aria-label="Next photo">→</button>
        </div>
        <div class="lb-footer">
          <div class="lb-meta">
            <strong id="lb-author"></strong>
            <span id="lb-handle"></span>
          </div>
          <span class="lb-count" id="lb-count"></span>
          <button class="mini primary" id="lb-open">open on X ↗</button>
        </div>
      </div>
    </div>

    <script type="module" src="feed.js"></script>
  </body>
</html>
